<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>肉鸽贪吃蛇 Rogue Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e0e6ff;
    user-select: none;
    touch-action: none;
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px;
  }
  .hud { display: flex; gap: 20px; font-size: 15px; letter-spacing: 1px; }
  .hud .label { color: #6b76a3; font-size: 11px; text-transform: uppercase; }
  .hud .value { font-size: 22px; font-weight: 700; color: #5df2c6; text-shadow: 0 0 12px rgba(93,242,198,.6); }
  .hud .value.best { color: #ffb84d; text-shadow: 0 0 12px rgba(255,184,77,.6); }
  .hud .value.evo { color: #b46bff; text-shadow: 0 0 12px rgba(180,107,255,.6); }
  .hud > div { text-align: center; }
  #buffBar { min-height: 24px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .buff-chip {
    font-size: 13px;
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(93,242,198,.1);
    border: 1px solid rgba(93,242,198,.35);
    color: #a5ffe4;
  }
  .curse-chip {
    background: rgba(255,93,122,.1);
    border: 1px solid rgba(255,93,122,.4);
    color: #ff9db1;
  }
  #stage {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 0 0 2px rgba(180,107,255,.3), 0 0 40px rgba(180,107,255,.12), 0 20px 60px rgba(0,0,0,.6);
    background: #0d1226;
  }
  canvas { display: block; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10,14,26,.85);
    backdrop-filter: blur(4px);
    transition: opacity .25s ease;
    padding: 16px;
    text-align: center;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .title {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #b46bff, #5df2c6, #4db8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(180,107,255,.45));
  }
  .subtitle { color: #8a94bd; font-size: 13px; letter-spacing: 2px; }
  .btn {
    padding: 12px 40px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #06121a;
    background: linear-gradient(135deg, #b46bff, #5df2c6);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(180,107,255,.45);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: scale(1.06); box-shadow: 0 0 34px rgba(180,107,255,.7); }
  .btn:active { transform: scale(.96); }
  .hint { color: #5b6590; font-size: 12px; letter-spacing: 1px; line-height: 1.8; }
  .gameover-title { font-size: 32px; font-weight: 800; color: #ff5d7a; text-shadow: 0 0 18px rgba(255,93,122,.6); letter-spacing: 4px; }
  .run-stats { color: #aab3d9; font-size: 14px; line-height: 2; }
  .run-stats b { color: #5df2c6; font-size: 20px; }
  .new-record { color: #ffb84d; font-weight: 700; letter-spacing: 2px; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  #pausedTag { position: absolute; top: 12px; right: 14px; font-size: 12px; color: #ffb84d; letter-spacing: 2px; display: none; }
  .draft-title { font-size: 26px; font-weight: 800; color: #b46bff; letter-spacing: 3px; text-shadow: 0 0 16px rgba(180,107,255,.6); }
  .draft-sub { color: #8a94bd; font-size: 13px; }
  #cardRow { display: flex; gap: 12px; justify-content: center; }
  .card {
    width: 112px;
    min-height: 168px;
    padding: 14px 8px;
    border-radius: 12px;
    background: linear-gradient(160deg, rgba(180,107,255,.16), rgba(93,242,198,.08));
    border: 1px solid rgba(180,107,255,.45);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-6px) scale(1.04); box-shadow: 0 8px 30px rgba(180,107,255,.4); border-color: #b46bff; }
  .card .icon { font-size: 32px; }
  .card .name { font-size: 14px; font-weight: 700; color: #e8dcff; }
  .card .desc { font-size: 11px; color: #9aa3cc; line-height: 1.5; }
  .card .cost { font-size: 10px; color: #ff9db1; margin-top: auto; }
  .card .cost.free { color: #5df2c6; }
  .card .key { font-size: 10px; color: #5b6590; }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div><div class="label">最高</div><div class="value best" id="best">0</div></div>
    <div><div class="label">进化</div><div class="value evo" id="evoLv">Lv.0</div></div>
    <div><div class="label">下次进化</div><div class="value" id="evoProg">0/5</div></div>
  </div>
  <div id="buffBar"></div>

  <div id="stage">
    <canvas id="game"></canvas>
    <div id="pausedTag">⏸ 已暂停</div>

    <div class="overlay" id="startScreen">
      <div class="title">肉鸽贪吃蛇</div>
      <div class="subtitle">ROGUE SNAKE · 进化</div>
      <button class="btn" id="startBtn">开始冒险</button>
      <div class="hint" id="controlHint"></div>
      <div class="hint">
        红豆 10分+1长度 · 金豆 50分+2长度 · 暗绿豆 1分-1长度<br>
        吞食豆子积累进化（5 / 10 / 15 / 25 / 35 / 45 / 60…）<br>
        每次进化三选一技能 · 技能的代价是地图上生成障碍<br>
        每 1000 分触发一次诅咒三选一
      </div>
    </div>

    <div class="overlay hidden" id="draftScreen">
      <div class="draft-title" id="draftTitle">✨ 进化 Lv.1！</div>
      <div class="draft-sub" id="draftSub">选择一项技能 —— 力量皆有代价</div>
      <div id="cardRow"></div>
    </div>

    <div class="overlay hidden" id="gameOverScreen">
      <div class="gameover-title">冒险终结</div>
      <div class="run-stats">
        进化等级 <b id="finalEvo">0</b> · 共吞食 <b id="finalBeans">0</b><br>
        本局得分 <b id="finalScore">0</b>
      </div>
      <div class="new-record" id="newRecord" style="display:none">🏆 新纪录！</div>
      <button class="btn" id="restartBtn">再来一局</button>
    </div>
  </div>
</div>

<script>
(() => {
  const GRID = 21;
  const BEAN_COUNT = 1;      // 地图上常驻豆子数（每次 1 颗，吃掉后按概率刷新种类）
  const MIN_LENGTH = 2;      // 蛇身最小长度
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const el = id => document.getElementById(id);
  const scoreEl = el('score'), bestEl = el('best'), evoLvEl = el('evoLv'), evoProgEl = el('evoProg');
  const startScreen = el('startScreen'), draftScreen = el('draftScreen'), gameOverScreen = el('gameOverScreen');
  const buffBar = el('buffBar'), pausedTag = el('pausedTag'), cardRow = el('cardRow');
  const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  el('controlHint').textContent = isTouch ? '手指滑动屏幕控制方向' : '方向键 / WASD 移动 · 空格暂停 · 数字键 1/2/3 选卡';

  // ============ 豆子种类 ============
  const BEAN_TYPES = {
    normal: { score: 10, growth: 1,  color: '#ff5d7a' },  // 普通豆（红）
    golden: { score: 50, growth: 2,  color: '#ffb84d' },  // 黄金豆（金）
    stale:  { score: 1,  growth: -1, color: '#9aa35b' },  // 过期豆（暗绿）
  };
  // 豆袋模型（加权随机）：初始袋中 90 普通 + 5 黄金 + 5 过期，共 100 颗
  // 幸运星每层 +3、黄金胃每层 +1 黄金豆；食欲不振 +10、减肥 +5、饥荒 +2、窜稀 +3 过期豆
  // 精致每层袋中普通豆 ×0.95（保底权重 20，普通豆不会消失）
  // 概率 = 该类豆子数 / 袋中总数（如 1 层幸运星后黄金豆概率 = 8/103）
  const BAG_BASE = { normal: 90, golden: 5, stale: 5 };
  const LUCKY_BONUS = 3;     // 幸运星每层袋中 +3 黄金豆
  const GOLD_BAG_BONUS = 1;  // 黄金胃每层袋中 +1 黄金豆
  const APPETITE_BONUS = 10; // 食欲不振每层袋中 +10 过期豆
  const DIET_BAG_BONUS = 5;  // 我要减肥!每层袋中 +5 过期豆
  const FAMINE_BAG_BONUS = 2;// 饥荒每层袋中 +2 过期豆
  const DIARRHEA_BAG_BONUS = 3; // 窜稀每层袋中 +3 过期豆

  // ============ 技能定义（cost = 生成的障碍数） ============
  const SKILL_POOL = [
    { id: 'shield',    icon: '🛡️', name: '圣盾',     desc: '抵挡一次致命碰撞（可叠加）',         cost: 3 },
    { id: 'magnet',    icon: '🧲', name: '食物磁铁', desc: '靠近的豆子被自动吞食（范围+1）',       cost: 3 },
    { id: 'gold',      icon: '💰', name: '黄金胃',   desc: '豆子得分 +30%，袋中黄金豆 +1（可叠加）', cost: 4 },
    { id: 'slow',      icon: '⚓', name: '稳定锚',   desc: '移速 -15%，操控更稳（可叠加）',       cost: 2 },
    { id: 'trim',      icon: '✂️', name: '瘦身剪',   desc: '立即缩短 30% 的身体',                 cost: 2 },
    { id: 'phase',     icon: '🌀', name: '相位穿越', desc: '穿过边界，从另一侧出现（唯一）',       cost: 5, once: true },
    { id: 'lucky',     icon: '🍀', name: '幸运星',   desc: '袋中黄金豆 +3（可叠加）',             cost: 3 },
    { id: 'appetite',  icon: '🤢', name: '食欲不振', desc: '袋中过期豆 +10（可叠加）',            cost: 2 },
    { id: 'diet',      icon: '🏃', name: '我要减肥!', desc: '过期豆长度额外 -1，且袋中过期豆 +5（可叠加）', cost: 2 },
    { id: 'famine',    icon: '🥣', name: '饥荒',     desc: '第n层：过期豆积分+2n、袋中+2n，其它豆 -2（保底 1 分）', cost: 1 },
    { id: 'refine',    icon: '💎', name: '精致',     desc: '普通豆出现率 -5%（有保底），积分 +10%（可叠加）', cost: 2 },
    { id: 'crit',      icon: '🎲', name: '小幸运',   desc: '吃豆积分暴击率 +5%，暴击时 ×2（可叠加）', cost: 2 },
    { id: 'depression', icon: '📉', name: '经济萧条', desc: '每吃 5 颗豆，障碍物变为临时过期豆（每层转化 1 个）', cost: 3 },
    { id: 'diarrhea',  icon: '💩', name: '窜稀',     desc: '吃过期豆后移速 -1%（可叠加），袋中过期豆 +3', cost: 1 },
    { id: 'indigestion', icon: '🤮', name: '消化不良', desc: '吃过期豆时 10% 概率拉出临时过期豆（可叠加）', cost: 1 },
    { id: 'digger',    icon: '⛏️', name: '掘金者',   desc: '生成障碍时，其旁 5% 概率出现临时黄金豆（可叠加）', cost: 2 },
    { id: 'feast',     icon: '🍖', name: '吃饱喝足', desc: '立刻获得 当前长度 ×10 的积分',         cost: 2 },
    { id: 'accumulate', icon: '🐷', name: '积少成多', desc: '每吃 10 颗过期豆，过期豆积分 +1（可叠加）', cost: 2 },
    { id: 'bounty',    icon: '🎯', name: '赏金任务', desc: '出现金色路线，完美走完得厚分，失败则永远失去（唯一）', cost: 3, once: true },
    { id: 'sweep',     icon: '🧹', name: '大扫除',   desc: '清除地图上所有障碍物（硬化障碍除外）', cost: 0 },
  ];
  const MAX_OBSTACLES = 90;

  // ============ 诅咒定义（每 1000 分三选一，硬化障碍常驻保底） ============
  const CURSE_POOL = [
    { id: 'wall',      icon: '🧱', name: '硬化障碍', desc: '生成 1 个无法消除的硬化障碍', cost: 0 },
    { id: 'siege',     icon: '🏰', name: '围城',     desc: '地图边缘内侧生成一圈普通障碍', cost: 0 },
    { id: 'rotland',   icon: '🕳️', name: '腐败之地', desc: '随机 3×3 区域被普通障碍填满', cost: 0 },
    { id: 'collapse',  icon: '🧲', name: '引力坍缩', desc: '所有普通障碍向地图中心聚拢一格', cost: 0 },
    { id: 'inflation', icon: '💸', name: '通胀',     desc: '所有豆子积分 -10%（可叠加）', cost: 0 },
    { id: 'headwind',  icon: '🌀', name: '逆风',     desc: '移速 +3%，操控更飘（可叠加）', cost: 0 },
    { id: 'fog',       icon: '🌫️', name: '迷雾',     desc: '只能看清蛇头周围 5 格（唯一）', cost: 0, once: true },
    { id: 'rot',       icon: '🦠', name: '腐烂',     desc: '豆子积分随移动贬值：每 10 格 -5%（可叠加）', cost: 0 },
  ];

  // ============ 状态 ============
  let cell = 20, size = 420;
  let snake, dir, nextDir, obstacles, beans;
  let score, best, beanCount, evoLevel, pendingGrow;
  let skills, alive, started, paused, drafting;
  let slowStacks;  // 窜稀减速层数
  let nextWallAt;  // 下一个诅咒的分数里程碑（每 1000 分一次）
  let staleEaten;  // 积少成多：已吃过期豆计数
  let bounty, bountyLevel, bountyTimer, bountyDead; // 赏金任务状态
  let fx;          // 飘字特效（得分/暴击提示）
  let curses, cursePending, evoPending, moveCount; // 诅咒系统状态
  let lastTick = 0;

  best = parseInt(localStorage.getItem('rogue_snake_best') || '0', 10);
  bestEl.textContent = best;

  const rand = n => (Math.random() * n) | 0;
  const same = (a, b) => a.x === b.x && a.y === b.y;
  const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);

  // 进化阈值（累计吞食数）：5,10,15,25,35,45,60,75,90,110…
  function evoThreshold(n) {
    let total = 0;
    for (let i = 0; i < n; i++) total += 5 * (Math.floor(i / 3) + 1);
    return total;
  }

  function rollBeanType() {
    const normalW = Math.max(20, Math.round(BAG_BASE.normal * Math.pow(0.95, skills.refine))); // 精致：每层普通豆 -5%，保底权重 20
    const goldenW = BAG_BASE.golden + LUCKY_BONUS * skills.lucky + GOLD_BAG_BONUS * skills.gold;
    const staleW = BAG_BASE.stale + APPETITE_BONUS * skills.appetite + DIET_BAG_BONUS * skills.diet + FAMINE_BAG_BONUS * skills.famine + DIARRHEA_BAG_BONUS * skills.diarrhea;
    const total = normalW + goldenW + staleW;
    let r = Math.random() * total;
    if (r < goldenW) return 'golden';
    r -= goldenW;
    if (r < staleW) return 'stale';
    return 'normal';
  }

  function resize() {
    const availW = window.innerWidth - 20;
    const availH = window.innerHeight - 150;
    size = Math.max(240, Math.min(availW, availH, 720));
    cell = Math.floor(size / GRID);
    size = cell * GRID;
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  }
  window.addEventListener('resize', resize);

  function interval() {
    // 基础速度随进化提升（每级 -5ms，最快 80ms）；无其它自动加速
    let v = Math.max(80, 150 - evoLevel * 5);
    v *= Math.pow(1.15, skills.slow);   // 稳定锚减速
    v *= Math.pow(1.01, slowStacks);    // 窜稀减速
    v *= Math.pow(0.97, curses.headwind); // 逆风诅咒：每层移速 +3%
    return Math.min(230, v);
  }

  function isFree(x, y) {
    if (obstacles.some(o => o.x === x && o.y === y)) return false;
    if (snake.some(s => s.x === x && s.y === y)) return false;
    if (beans.some(b => b.x === x && b.y === y)) return false;
    if (bounty && bounty.path.some(p => p.x === x && p.y === y)) return false; // 赏金路线格不被任何生成物占用
    return true;
  }

  function randomFreeCell(minHeadDist = 0) {
    for (let tries = 0; tries < 400; tries++) {
      const c = { x: rand(GRID), y: rand(GRID) };
      if (minHeadDist && manhattan(c, snake[0]) < minHeadDist) continue;
      if (isFree(c.x, c.y)) return c;
    }
    return null;
  }

  function spawnBean() {
    const c = randomFreeCell();
    if (c) beans.push({ x: c.x, y: c.y, type: rollBeanType(), born: moveCount });
  }

  function spawnObstacles(n) {
    for (let i = 0; i < n && obstacles.filter(o => !o.hard).length < MAX_OBSTACLES; i++) {
      const c = randomFreeCell(4); // 离蛇头至少 4 格，避免贴脸杀
      if (!c) continue;
      obstacles.push(c);
      // 掘金者：每个新生成的障碍物旁 5%×层数 概率出现临时黄金豆
      if (skills.digger > 0 && Math.random() < Math.min(1, 0.05 * skills.digger)) {
        spawnTempBean(neighborFreeCell(c), 'golden');
      }
    }
  }

  // 找某格上下左右相邻的空格
  function neighborFreeCell(c) {
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (const [dx, dy] of dirs) {
      const x = c.x + dx, y = c.y + dy;
      if (x >= 0 && y >= 0 && x < GRID && y < GRID && isFree(x, y)) return { x, y };
    }
    return null;
  }

  // 生成临时豆（空心豆：吃掉后不刷新、不计进化）；优先放在指定格子（如刚缩掉的尾巴）
  function spawnTempBean(prefer, type = 'stale') {
    const c = prefer && isFree(prefer.x, prefer.y) ? prefer : randomFreeCell();
    if (c) beans.push({ x: c.x, y: c.y, type, temp: true, born: moveCount });
  }

  // 经济萧条：每层技能把 1 个障碍物变为临时过期豆（硬化障碍免疫）
  function depress() {
    for (let i = 0; i < skills.depression; i++) {
      const soft = obstacles.filter(o => !o.hard);
      if (!soft.length) break;
      const o = soft[rand(soft.length)];
      obstacles.splice(obstacles.indexOf(o), 1);
      spawnTempBean(o);
    }
  }

  // 硬化障碍：无法被任何形式消除（圣盾/大扫除/经济萧条均无效）；由「硬化障碍」诅咒生成
  function spawnHardObstacle() {
    const c = randomFreeCell(4);
    if (c) obstacles.push({ x: c.x, y: c.y, hard: true });
  }

  // 每 1000 分积累一次诅咒抉择（入队，由 processDrafts 依次弹出）
  function checkMilestone() {
    while (score >= nextWallAt) {
      cursePending++;
      nextWallAt += 1000;
    }
  }

  // 依次处理排队的进化/诅咒抉择（进化优先）
  function processDrafts() {
    if (drafting || !alive) return;
    if (evoPending > 0) { evoPending--; evolve(); }
    else if (cursePending > 0) { cursePending--; openCurseDraft(); }
  }

  // ============ 诅咒效果 ============
  function curseObstacle(x, y) { // 诅咒生成的普通障碍（尊重上限与空格）
    if (x < 0 || y < 0 || x >= GRID || y >= GRID) return;
    if (obstacles.filter(o => !o.hard).length >= MAX_OBSTACLES) return;
    if (!isFree(x, y)) return;
    obstacles.push({ x, y });
  }

  function applyCurse(id) {
    if (id === 'wall') {
      spawnHardObstacle();
    } else if (id === 'siege') { // 围城：最外圈内侧生成一圈普通障碍
      for (let x = 1; x < GRID - 1; x++) {
        curseObstacle(x, 1);
        curseObstacle(x, GRID - 2);
      }
      for (let y = 2; y < GRID - 2; y++) {
        curseObstacle(1, y);
        curseObstacle(GRID - 2, y);
      }
    } else if (id === 'rotland') { // 腐败之地：随机 3×3 填满
      const c = randomFreeCell(4);
      if (c) for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) curseObstacle(c.x + dx, c.y + dy);
    } else if (id === 'collapse') { // 引力坍缩：普通障碍向中心靠拢一格
      const mid = Math.floor(GRID / 2);
      for (const o of obstacles) {
        if (o.hard) continue; // 硬化障碍纹丝不动
        const dx = Math.sign(mid - o.x), dy = Math.sign(mid - o.y);
        const opts = Math.abs(mid - o.x) >= Math.abs(mid - o.y)
          ? [{ x: o.x + dx, y: o.y }, { x: o.x, y: o.y + dy }]
          : [{ x: o.x, y: o.y + dy }, { x: o.x + dx, y: o.y }];
        for (const t of opts) {
          if (t.x === o.x && t.y === o.y) continue;
          if (t.x < 0 || t.y < 0 || t.x >= GRID || t.y >= GRID) continue;
          if (obstacles.some(p => p !== o && same(p, t))) continue;
          if (snake.some(s => same(s, t)) || beans.some(b => same(b, t))) continue;
          if (bounty && bounty.path.some(p => same(p, t))) continue;
          o.x = t.x; o.y = t.y;
          break;
        }
      }
    }
    // inflation / headwind / fog / rot：通过层数在对应系统生效
  }

  // ============ 赏金任务 ============
  // 第 n 条路线：5n 步，每步 10n 分；走上第一步后必须步步踩点，失败则本局不再刷新
  function spawnBounty() {
    const steps = 5 * bountyLevel;
    const start = randomFreeCell(3); // 起点离蛇头至少 3 格
    if (!start) { bountyTimer = 5; return; } // 没地方放，5 回合后重试
    const path = [start];
    while (path.length < steps) {
      const last = path[path.length - 1];
      const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]]
        .map(([dx, dy]) => ({ x: last.x + dx, y: last.y + dy }))
        .filter(c => c.x >= 0 && c.y >= 0 && c.x < GRID && c.y < GRID
          && isFree(c.x, c.y) && !path.some(p => same(p, c)));
      if (!opts.length) break; // 随机游走被堵死，用已有长度
      path.push(opts[rand(opts.length)]);
    }
    if (path.length < 2) { bountyTimer = 5; return; }
    bounty = { path, idx: 0, started: false };
  }

  function completeBounty() {
    score += bounty.path.length * 10 * bountyLevel; // 奖励 = 步数 × 每步积分
    scoreEl.textContent = score;
    checkMilestone();
    bounty = null;
    bountyLevel++;
    bountyTimer = 5; // 5 回合后刷新下一条
  }

  function failBounty() {
    bounty = null;
    bountyDead = true; // 本局永远失去赏金任务
  }

  function resetRun() {
    score = 0; beanCount = 0; evoLevel = 0; pendingGrow = 0;
    skills = { shield: 0, magnet: 0, gold: 0, slow: 0, trim: 0, phase: 0, lucky: 0, appetite: 0, diet: 0, famine: 0, refine: 0, crit: 0, depression: 0, diarrhea: 0, indigestion: 0, digger: 0, feast: 0, accumulate: 0, bounty: 0, sweep: 0 };
    slowStacks = 0;
    nextWallAt = 1000;
    staleEaten = 0;
    bounty = null; bountyLevel = 1; bountyTimer = 0; bountyDead = false;
    fx = [];
    curses = { wall: 0, siege: 0, rotland: 0, collapse: 0, inflation: 0, headwind: 0, fog: 0, rot: 0 };
    cursePending = 0; evoPending = 0; moveCount = 0;
    const c = Math.floor(GRID / 2);
    snake = [{ x: c, y: c }, { x: c - 1, y: c }, { x: c - 2, y: c }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    obstacles = [];
    beans = [];
    for (let i = 0; i < BEAN_COUNT; i++) spawnBean();
    scoreEl.textContent = '0';
    updateEvoHud();
    renderBuffs();
  }

  function updateEvoHud() {
    evoLvEl.textContent = `Lv.${evoLevel}`;
    evoProgEl.textContent = `${Math.min(beanCount, evoThreshold(evoLevel + 1))}/${evoThreshold(evoLevel + 1)}`;
  }

  function renderBuffs() {
    buffBar.innerHTML = '';
    for (const s of SKILL_POOL) {
      const n = skills[s.id];
      if (n > 0 && !['trim', 'sweep', 'feast'].includes(s.id)) {
        const chip = document.createElement('div');
        chip.className = 'buff-chip';
        chip.textContent = n > 1 ? `${s.icon}×${n}` : s.icon;
        chip.title = s.name;
        buffBar.appendChild(chip);
      }
    }
    if (slowStacks > 0) { // 窜稀减速指示
      const chip = document.createElement('div');
      chip.className = 'buff-chip';
      chip.textContent = `🐌×${slowStacks}`;
      chip.title = '窜稀减速';
      buffBar.appendChild(chip);
    }
    for (const c of CURSE_POOL) { // 生效中的诅咒（红色标记）
      const n = curses[c.id];
      if (n > 0) {
        const chip = document.createElement('div');
        chip.className = 'buff-chip curse-chip';
        chip.textContent = n > 1 ? `${c.icon}×${n}` : c.icon;
        chip.title = c.name;
        buffBar.appendChild(chip);
      }
    }
  }

  function die() {
    alive = false;
    const isRecord = score > best;
    if (isRecord) {
      best = score;
      localStorage.setItem('rogue_snake_best', String(best));
      bestEl.textContent = best;
    }
    el('finalEvo').textContent = `Lv.${evoLevel}`;
    el('finalBeans').textContent = beanCount;
    el('finalScore').textContent = score;
    el('newRecord').style.display = isRecord ? 'block' : 'none';
    gameOverScreen.classList.remove('hidden');
  }

  function eatBean(bean) {
    const t = BEAN_TYPES[bean.type];
    // 积少成多：每吃 10 颗过期豆，过期豆积分 +1×层数（临时过期豆同样计数）
    const accBonus = Math.floor(staleEaten / 10) * skills.accumulate;
    let base = t.score;
    if (bean.type === 'stale') {
      base += 2 * skills.famine + accBonus; // 饥荒：第 n 层过期豆积分 +2n
    } else if (skills.famine > 0) {
      base = Math.max(1, base - 2); // 饥荒：其它豆积分 -2，保底 1 分
    }
    if (bean.type === 'normal') base *= 1 + 0.1 * skills.refine;     // 精致：普通豆积分 +10%/层
    // 腐烂诅咒：豆子每 10 格移动贬值 5%×层数
    base *= Math.pow(0.95, curses.rot * Math.floor((moveCount - (bean.born || 0)) / 10));
    base *= Math.pow(0.9, curses.inflation); // 通胀诅咒：每层 -10%
    let gain = Math.max(1, Math.round(base * (1 + 0.3 * skills.gold))); // 黄金胃：每层 +30%
    // 小幸运：每层 +5% 暴击率，暴击时吃豆积分 ×2
    const crited = skills.crit > 0 && Math.random() < Math.min(1, 0.05 * skills.crit);
    if (crited) gain *= 2;
    score += gain;
    fx.push({ x: bean.x, y: bean.y, text: crited ? `暴击 +${gain}!` : `+${gain}`, color: crited ? '#ffd86b' : '#a5ffe4', until: performance.now() + 800 });
    scoreEl.textContent = score;
    checkMilestone(); // 每 1000 分积累一次诅咒
    renderBuffs();
    if (!bean.temp) { // 临时过期豆不计入进化
      beanCount++;
      updateEvoHud();
    }
    let popped = null;
    if (t.growth > 0) {
      pendingGrow += t.growth;
    } else if (t.growth < 0) {
      // 过期豆：缩短身体（保底最小长度）；「我要减肥!」每层额外 -1
      const shrink = -t.growth + skills.diet;
      for (let i = 0; i < shrink && snake.length > MIN_LENGTH; i++) popped = snake.pop();
    }
    if (bean.type === 'stale') {
      staleEaten++; // 积少成多计数
      // 窜稀：每次吃过期豆叠加减速（每层技能 +1 层减速）
      if (skills.diarrhea > 0) {
        slowStacks += skills.diarrhea;
        renderBuffs();
      }
      // 消化不良：概率在刚缩掉的尾巴处拉出临时过期豆
      if (skills.indigestion > 0 && Math.random() < Math.min(1, 0.1 * skills.indigestion)) {
        spawnTempBean(popped);
      }
    }
    if (!bean.temp) {
      // 经济萧条：每吃 5 颗豆，障碍物变为临时过期豆
      if (skills.depression > 0 && beanCount % 5 === 0) depress();
      if (beanCount >= evoThreshold(evoLevel + 1)) evoPending++; // 进化入队
    }
    processDrafts(); // 依次弹出排队的进化/诅咒抉择
  }

  function tick() {
    moveCount++; // 全局移动计数（腐烂诅咒以此计算贬值）
    dir = nextDir;
    let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 边界处理
    const out = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
    if (out) {
      if (skills.phase > 0) {
        head.x = (head.x + GRID) % GRID;
        head.y = (head.y + GRID) % GRID;
      } else if (skills.shield > 0) {
        skills.shield--; renderBuffs();
        return; // 圣盾抵挡，原地不动一回合
      } else return die();
    }

    // 撞障碍
    const oIdx = obstacles.findIndex(o => same(o, head));
    if (oIdx >= 0) {
      if (skills.shield > 0) {
        skills.shield--; renderBuffs();
        if (obstacles[oIdx].hard) return; // 硬化障碍：圣盾保命但撞不碎，原地停一回合
        obstacles.splice(oIdx, 1); // 圣盾撞碎障碍
      } else return die();
    }

    // 撞到自己
    const sIdx = snake.findIndex(s => same(s, head));
    if (sIdx >= 0) {
      if (skills.shield > 0) {
        skills.shield--; renderBuffs();
        snake.length = Math.max(MIN_LENGTH, sIdx); // 圣盾断尾保命
      } else return die();
    }

    snake.unshift(head);

    // 吃豆（含磁铁吸附，可一次吸多颗）
    const eaten = beans.filter(b =>
      same(head, b) || (skills.magnet > 0 && manhattan(head, b) <= skills.magnet));
    for (const b of eaten) {
      beans.splice(beans.indexOf(b), 1);
      eatBean(b);
      if (!b.temp) spawnBean(); // 临时过期豆不刷新
    }

    // 长度增长队列
    if (pendingGrow > 0) {
      pendingGrow--;
    } else {
      snake.pop();
    }

    // 赏金任务：路线判定
    if (bounty) {
      if (!bounty.started) {
        if (same(head, bounty.path[0])) { bounty.started = true; bounty.idx = 1; }
      } else if (same(head, bounty.path[bounty.idx])) {
        bounty.idx++;
        if (bounty.idx >= bounty.path.length) completeBounty();
      } else {
        failBounty(); // 走错一步，任务失败
      }
    }
    // 赏金任务：刷新倒计时
    if (skills.bounty > 0 && !bountyDead && !bounty && bountyTimer > 0) {
      bountyTimer--;
      if (bountyTimer === 0) spawnBounty();
    }
  }

  function evolve() {
    drafting = true;
    evoLevel++;
    updateEvoHud();
    el('draftTitle').innerHTML = `✨ 进化 Lv.${evoLevel}！`;
    el('draftSub').textContent = '选择一项技能 —— 力量皆有代价';
    // 随机抽 3 张不同的卡；唯一技能（相位穿越/赏金任务）拿到后不再出现
    const pool = SKILL_POOL.filter(s => !s.once || skills[s.id] === 0);
    const picks = [];
    for (let i = 0; i < 3 && pool.length; i++) {
      picks.push(pool.splice(rand(pool.length), 1)[0]);
    }
    showCards(picks, 'evo');
  }

  // 诅咒三选一：硬化障碍常驻保底，其余 2 张从诅咒池随机（唯一诅咒拿到后不再出现）
  function openCurseDraft() {
    drafting = true;
    el('draftTitle').textContent = '⚠️ 诅咒降临！';
    el('draftSub').textContent = `得分突破 ${(nextWallAt - 1000).toLocaleString()} —— 选择一种诅咒`;
    const rest = CURSE_POOL.filter(c => c.id !== 'wall' && (!c.once || curses[c.id] === 0));
    const picks = [CURSE_POOL[0]];
    while (picks.length < 3 && rest.length) picks.push(rest.splice(rand(rest.length), 1)[0]);
    showCards(picks, 'curse');
  }

  function showCards(picks, mode) {
    cardRow.innerHTML = '';
    picks.forEach((s, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      const costHtml = mode === 'curse'
        ? '<div class="cost">即刻生效</div>'
        : (s.cost === 0
          ? '<div class="cost free">无代价</div>'
          : `<div class="cost">代价：生成 ${s.cost} 个障碍</div>`);
      card.innerHTML = `<div class="icon">${s.icon}</div><div class="name">${s.name}</div><div class="desc">${s.desc}</div>${costHtml}${isTouch ? '' : `<div class="key">按 ${i + 1}</div>`}`;
      card.addEventListener('click', () => mode === 'curse' ? chooseCurse(s) : chooseSkill(s));
      cardRow.appendChild(card);
    });
    draftScreen.dataset.picks = JSON.stringify(picks.map(p => p.id));
    draftScreen.dataset.mode = mode;
    draftScreen.classList.remove('hidden');
  }

  function chooseCurse(c) {
    if (!drafting) return;
    curses[c.id]++;
    applyCurse(c.id);
    drafting = false;
    draftScreen.classList.add('hidden');
    renderBuffs();
    lastTick = performance.now();
    processDrafts(); // 可能还有排队的进化/诅咒
  }

  function chooseSkill(s) {
    if (!drafting) return;
    if (s.id === 'trim') {
      snake = snake.slice(0, Math.max(MIN_LENGTH + 1, Math.ceil(snake.length * 0.7)));
    } else if (s.id === 'sweep') {
      obstacles = obstacles.filter(o => o.hard); // 大扫除清不掉硬化障碍
    } else if (s.id === 'feast') {
      score += snake.length * 10; // 吃饱喝足：一次性积分
      scoreEl.textContent = score;
      checkMilestone();
    } else {
      skills[s.id]++;
      if (s.id === 'bounty') spawnBounty(); // 赏金任务：立刻生成第一条路线
    }
    spawnObstacles(s.cost);
    drafting = false;
    draftScreen.classList.add('hidden');
    renderBuffs();
    lastTick = performance.now();
    processDrafts(); // 可能还有排队的诅咒/进化
  }

  // ============ 渲染 ============
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(now) {
    ctx.fillStyle = '#0d1226';
    ctx.fillRect(0, 0, size, size);
    // 网格
    ctx.strokeStyle = 'rgba(180, 107, 255, 0.06)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell); ctx.stroke();
    }
    // 障碍物（暗紫晶石；硬化障碍为暗红色，无法消除）
    ctx.save();
    ctx.shadowBlur = 6;
    for (const o of obstacles) {
      if (o.hard) {
        ctx.shadowColor = '#ff5d7a';
        ctx.fillStyle = '#571c2b';
      } else {
        ctx.shadowColor = '#7a3bbf';
        ctx.fillStyle = '#3d2358';
      }
      roundRect(o.x * cell + 2, o.y * cell + 2, cell - 4, cell - 4, cell * 0.2);
      ctx.fill();
      if (o.hard) { // 硬化障碍画一个核心点标记
        ctx.fillStyle = '#ff5d7a';
        ctx.beginPath();
        ctx.arc(o.x * cell + cell / 2, o.y * cell + cell / 2, cell * 0.12, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
    // 赏金任务路线（金色脚印，下一个目标高亮闪烁）
    if (bounty) {
      ctx.save();
      const nextIdx = bounty.started ? bounty.idx : 0;
      for (let i = nextIdx; i < bounty.path.length; i++) {
        const c = bounty.path[i];
        const isNext = i === nextIdx;
        const px = c.x * cell + cell / 2, py = c.y * cell + cell / 2;
        ctx.shadowColor = '#ffd86b';
        ctx.shadowBlur = isNext ? 12 : 4;
        ctx.fillStyle = isNext ? '#ffd86b' : 'rgba(255, 216, 107, .35)';
        ctx.beginPath();
        ctx.arc(px, py, isNext ? cell * 0.26 * (0.85 + 0.15 * Math.sin(now / 150)) : cell * 0.13, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    // 豆子（按种类着色；临时过期豆画成空心圆环）
    for (const b of beans) {
      const t = BEAN_TYPES[b.type];
      const pulse = 0.75 + 0.25 * Math.sin(now / 200 + b.x + b.y);
      const bx = b.x * cell + cell / 2, by = b.y * cell + cell / 2;
      const br = cell * 0.3 * pulse + cell * 0.1;
      ctx.save();
      ctx.shadowColor = t.color;
      ctx.shadowBlur = (b.type === 'golden' ? 18 : 14) * pulse;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      if (b.temp) {
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 2;
        ctx.stroke();
      } else {
        ctx.fillStyle = t.color;
        ctx.fill();
      }
      ctx.restore();
    }
    // 蛇
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      const isHead = i === 0;
      ctx.save();
      ctx.shadowColor = skills.phase > 0 ? '#4db8ff' : '#5df2c6';
      ctx.shadowBlur = isHead ? 14 : 6;
      ctx.fillStyle = isHead
        ? (skills.phase > 0 ? '#bfe6ff' : '#a5ffe4')
        : `rgba(93, 242, 198, ${1 - t * 0.65})`;
      const pad = isHead ? 1.5 : 2.5;
      roundRect(seg.x * cell + pad, seg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.28);
      ctx.fill();
      ctx.restore();
      if (isHead) {
        // 圣盾光环
        if (skills.shield > 0) {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 216, 107, .85)';
          ctx.shadowColor = '#ffd86b';
          ctx.shadowBlur = 10;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(seg.x * cell + cell / 2, seg.y * cell + cell / 2, cell * 0.62, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
        // 眼睛
        const cx = seg.x * cell + cell / 2, cy = seg.y * cell + cell / 2;
        const ex = dir.x !== 0 ? dir.x * cell * 0.14 : 0;
        const ey = dir.y !== 0 ? dir.y * cell * 0.14 : 0;
        const off = cell * 0.17;
        ctx.fillStyle = '#06121a';
        ctx.beginPath();
        ctx.arc(cx + ex + (dir.y !== 0 ? off : 0), cy + ey + (dir.x !== 0 ? off : 0), cell * 0.08, 0, Math.PI * 2);
        ctx.arc(cx + ex - (dir.y !== 0 ? off : 0), cy + ey - (dir.x !== 0 ? off : 0), cell * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    // 飘字特效（得分/暴击提示，上飘并淡出）
    if (fx.length) {
      fx = fx.filter(f => f.until > now);
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = `bold ${Math.floor(cell * 0.55)}px sans-serif`;
      for (const f of fx) {
        const k = (f.until - now) / 800; // 1→0
        ctx.globalAlpha = Math.max(0, k);
        ctx.fillStyle = f.color || '#ffd86b';
        ctx.shadowColor = f.color || '#ffd86b';
        ctx.shadowBlur = 10;
        ctx.fillText(f.text, f.x * cell + cell / 2, f.y * cell - (1 - k) * cell);
      }
      ctx.restore();
    }
    // 迷雾诅咒：只看清蛇头周围 5 格
    if (curses.fog > 0 && snake.length) {
      const hx = snake[0].x * cell + cell / 2, hy = snake[0].y * cell + cell / 2;
      const g = ctx.createRadialGradient(hx, hy, cell * 2.5, hx, hy, cell * 5);
      g.addColorStop(0, 'rgba(10,14,26,0)');
      g.addColorStop(1, 'rgba(5,8,16,0.96)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, size, size);
    }
  }

  function loop(now) {
    requestAnimationFrame(loop);
    if (!started || paused || drafting || !alive) { draw(now); return; }
    if (now - lastTick >= interval()) {
      lastTick = now;
      tick();
    }
    draw(now);
  }

  function startGame() {
    resetRun();
    started = true;
    alive = true;
    paused = false;
    drafting = false;
    pausedTag.style.display = 'none';
    lastTick = performance.now();
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    draftScreen.classList.add('hidden');
    if (document.activeElement) document.activeElement.blur(); // 防止回车误触按钮重开
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  function togglePause() {
    if (!started || !alive || drafting) return;
    paused = !paused;
    pausedTag.style.display = paused ? 'block' : 'none';
  }

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
    if (drafting && ['1','2','3'].includes(k)) {
      const picks = JSON.parse(draftScreen.dataset.picks || '[]');
      const pool = draftScreen.dataset.mode === 'curse' ? CURSE_POOL : SKILL_POOL;
      const s = pool.find(x => x.id === picks[+k - 1]);
      if (s) (draftScreen.dataset.mode === 'curse' ? chooseCurse(s) : chooseSkill(s));
      return;
    }
    if (k === 'arrowup' || k === 'w') setDir(0, -1);
    else if (k === 'arrowdown' || k === 's') setDir(0, 1);
    else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
    else if (k === 'arrowright' || k === 'd') setDir(1, 0);
    else if (k === ' ') { if (!started || !alive) startGame(); else togglePause(); }
    else if (k === 'enter' && (!started || !alive)) startGame();
  });

  let touchStart = null;
  window.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!touchStart || drafting) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touchStart = null;
  }, { passive: true });

  el('startBtn').addEventListener('click', startGame);
  el('restartBtn').addEventListener('click', startGame);

  // 初始化展示画面
  resetRun();
  started = false;
  alive = true;
  paused = false;
  drafting = false;
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
